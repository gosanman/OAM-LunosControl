;
; KNXFANDRV / OAM-KwlControl — Bauumgebungen
;
; Die Basisumgebungen kommen aus OGM-Common (platformio.base.ini, platformio.rp2040.ini),
; eingebunden über platformio.ini. Hier stehen nur die Abweichungen dieses Geräts.
;

[custom]
build_flags =
  ; OPENKNX_WATCHDOG gehört in Releases, nicht hierher
  ; -D OPENKNX_WATCHDOG
  ; -D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  ; -D DEBUG_TP_FRAMES
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; RP2040-Gemeinsamkeiten dieses Geräts
[RP2040_custom]
extends = RP2040, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -Wunused-variable


; =============================== Entwicklung ===============================

; KNXFANDRV Rev 0.1 — eigene Platine, OpenKNX-BCU-Modul GN100 plus eigener RP2040 (U100),
; zwei GP8413 über ADuM1250, vier Stellsignale S1…S4.
;
; OPENKNX_DUALCORE ist bewusst NICHT gesetzt: es gibt keinen Tachoeingang und keine zweite
; Aufgabe, die einen eigenen Kern rechtfertigt. Der I²C-Verkehr zu den DACs ist kurz und
; läuft in loop().
;
; RP2040_16MB entspricht dem Flashbaustein auf U100 (16 MiB, am Board abgelesen). Ohne
; diese Angabe gaelte die Vorgabe RP2040_2MB aus der OGM-Common-Basis, das Dateisystem
; waere dann 1 MiB statt 15 MiB.
[env:develop_KnxFanDrv]
extends = RP2040_develop, RP2040_custom, custom_develop, RP2040_16MB
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  -D DEVICE_KNXFANDRV_REV01

; Dasselbe Board, aber Flashen und Konsole über die OpenKNX-DebugProbe im WLAN statt über
; ein USB-Kabel. Nur der Transportweg wechselt. Adresse der Probe anpassen; sie liefert die
; Zeilen selbst unter /api/snippet.
; Der ausdrückliche Pfad auf die .uf2 ist kein Eigenbau: $SOURCE ist bei dieser Plattform
; die firmware.bin, und die Probe validiert auf UF2.
; [env:develop_KnxFanDrv_probe]
; extends = env:develop_KnxFanDrv
; monitor_port    = socket://openknx-probe-XXXX.local:2323
; monitor_speed   = 115200
; upload_protocol = custom
; upload_command  = curl --fail-with-body --data-binary "@$BUILD_DIR/${PROGNAME}.uf2" http://openknx-probe-XXXX.local/api/flash

; Entwicklungsaufbau Pico + DFR1073, zwei Kanäle, ein GP8413 auf 0x58.
; Laut docs/PLAN.md („Kein Entwicklungsaufbau") wird dieser Aufbau nicht beschafft; die
; Hardwareauswahl in der ETS behält den Eintrag nur als Option. Es gibt deshalb keinen
; Board-Header dafür — wer den Aufbau baut, legt ihn an und nimmt diese Umgebung in Betrieb.
; [env:develop_DevPico]
; extends = RP2040_develop, RP2040_custom, custom_develop
; build_flags =
;   ${KNX_TP.build_flags}
;   ${RP2040_develop.build_flags}
;   ${RP2040_custom.build_flags}
;   ${custom_develop.build_flags}
;   -D DEVICE_KNXFANDRV_DEVPICO


; =============================== Phase 1 ===============================

; Testfirmware für den Hardwarenachweis: RP2040, I²C und eine serielle Konsole — mehr nicht.
; Ohne KNX-Stack, ohne OGM-Common, ohne knxprod.h. Damit lässt sie sich bauen, BEVOR das
; Busformat der DACs gemessen ist (Messung P6) und bevor es eine ETS-Applikation gibt.
;
; extra_scripts und lib_deps werden absichtlich geleert: die Vorgaben aus
; OGM-Common/platformio.base.ini würden sonst versions.h erzeugen wollen und OGM-Common
; mitziehen. build_src_filter lässt nur die Testquelle übrig.
[env:test_dac]
platform = ${RP2040.platform}
platform_packages = ${RP2040.platform_packages}
board = rpipico
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
extra_scripts =
lib_deps =
build_src_filter = -<*> +<main_dactest.cpp>
build_flags =
  -D SERIAL_DEBUG=Serial


; =============================== Release ===============================

; Watchdog an, Debug aus, dependencies.txt eingefroren. Erst ausfüllen, wenn Phase 1
; abgeschlossen und FANDRV_DAC_LEFT_ALIGNED gemessen ist.
