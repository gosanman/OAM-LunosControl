; build_flags =
;   ${KNX_TP.build_flags}
;   ${RP2040_releases.build_flags}
;   ${RP2040_custom.build_flags}
;   ${custom_releases.build_flags}
;   -D OPENKNX_WATCHDOG
;   -D DEVICE_KNXFANDRV_REV01
