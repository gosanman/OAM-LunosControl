;
; global custom
;
[custom]
build_flags =
  ; add OPENKNX_WATCHDOG normal only in releases and not here
  ; -D OPENKNX_WATCHDOG
  ; -D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  ; -D DEBUG_TP_FRAMES
  ; -D OPENKNX_DUALCORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG


[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; RP2040
[RP2040_custom]
extends = RP2040, custom
#platform = https://github.com/maxgerhardt/platform-raspberrypi.git
build_flags =
  -D SERIAL_DEBUG=Serial
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -Wunused-variable
  ; -D DEBUG_TP_FRAMES

; RP2040_16MB entspricht dem REG1-Controller2040 (16 MiB). Ohne diese Angabe gilt die
; Vorgabe RP2040_2MB aus der OGM-Common-Basis, das Dateisystem waere dann 1 MiB statt 15 MiB.
[env:develop_RP2040]
extends = RP2040_develop, RP2040_custom, custom_develop, RP2040_16MB
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ; -D DEVICE_REG1_BASE_V1
  ; -D DEVICE_REG1_SEN_MULTI
  ; -D DEVICE_PIPICO_BCU_CONNECTOR
  -D DEVICE_REG1_FAN_ADDON_X2
  -D OPENKNX_DUALCORE
  ; -D SML_TEST_STRINGS


; Dasselbe Board, aber Flashen und Konsole ueber die OpenKNX-DebugProbe im WLAN statt ueber ein
; USB-Kabel am Geraet. Der Rest ist identisch zu develop_RP2040 - nur der Transportweg wechselt,
; deshalb eine eigene Umgebung und keine Aenderung an der bestehenden: der USB-Weg bleibt
; benutzbar, etwa wenn die Probe nicht am Geraet steckt.
;
; Die Zeilen liefert die Probe selbst unter /api/snippet - sie kennt ihren Namen und sieht, was
; angesteckt ist. Bei einer anderen Probe dort neu abholen; unten steht ihr Stand unveraendert.
;
; Der ausdrueckliche Pfad auf die .uf2 ist kein Eigenbau: $SOURCE ist bei dieser Plattform die
; firmware.bin, und die Probe validiert auf UF2. --fail-with-body statt -f, damit der Grund einer
; abgelehnten Datei am Aufrufer steht und nicht nur "curl: (22)".
[env:develop_RP2040_probe]
extends = env:develop_RP2040
monitor_port    = socket://openknx-probe-d820.local:2323
monitor_speed   = 115200
upload_protocol = custom
upload_command  = curl --fail-with-body --data-binary "@$BUILD_DIR/${PROGNAME}.uf2" http://openknx-probe-d820.local/api/flash


; MrSpieb HW-FanControl: zwei Ausgaenge je Knoten (S2 fuehrt dasselbe Signal wie S1, fuer den
; zweiten Luefter eines Maico-Paares), kein Tachoeingang. Die Board-Unterschiede stecken
; ausschliesslich in hardware.h - die ETS-Applikation ist fuer beide Boards dieselbe.
; Ohne DEVICE_*-Define greift in hardware.h die Vorgabe MrSpiebFanControlHardware.h.
[env:develop_RP2040_MrSpieb]
extends = RP2040_develop, RP2040_custom, custom_develop
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ; kein OPENKNX_DUALCORE: ohne Tachoeingang gibt es auf Core 1 nichts zu tun


